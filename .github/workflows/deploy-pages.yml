name: Deploy GitHub Pages

# NOTE: GitHub Pages cannot send HTTP response headers, so the CSP and other security
# headers in frontend/_headers are NOT applied here. Cloudflare (wrangler.toml) is the
# production target that enforces them; use this workflow only as a secondary mirror.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Never publish a build that fails lint, tests or the security configuration checks.
      - name: Run all checks
        run: npm run check

      - name: Prepare static website
        run: node scripts/build-static.js --out _site --keep-redirects --spa-404

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
