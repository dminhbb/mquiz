name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ESLint, Prettier, design + security config checks, unit tests, Deno type-check and
      # Edge Function tests, then a production build.
      - name: Run all checks
        run: npm run check

      - name: Audit dependencies (high and critical)
        run: npm run audit:deps
